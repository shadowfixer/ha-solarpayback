name: "HA SolarPayBack"
version: "1.0.0"
slug: "ha_solarpayback"
description: "Local solar payback dashboard for Home Assistant — SolarPayBack-style UI with ingress, SQLite backend, and server-side HA API proxy"
url: "https://github.com/shadowfixer/ha-solarpayback"
arch:
  - "aarch64"
  - "amd64"
  - "armv7"
startup: "application"
boot: "auto"
ingress: true
ingress_port: 8099
ingress_entry: "/"
auth_api: true
hassio_api: true
homeassistant_api: true
ports:
  8099/tcp: 8099
map:
  - "data:rw"
# Local build from the repo Dockerfile (no registry image - omit `image:` so the
# Supervisor builds the add-on from the Dockerfile for the target architecture).
options: {}
schema: {}