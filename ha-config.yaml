# HA SolarPayBack — Add to your configuration.yaml (typically in /config/configuration.yaml)
# This creates a file sensor that exposes /config/ha-solarpayback-data.json as sensor.ha_solarpayback_data
# The app reads from this sensor via HA REST API to restore data on first load.

# File sensor to expose the persisted data
sensor:
  - platform: file
    name: "HA SolarPayBack Data"
    file_path: "/config/ha-solarpayback-data.json"
    unique_id: "ha_solarpayback_data"
    # The file contains JSON: {"gridEvents": [...], "tariffHistory": [...], "savedAt": "..."}

# Shell command to persist data (called by app via POST /api/services/shell_command/ha_solarpayback_store)
shell_command:
  ha_solarpayback_store: 'python3 /config/packages/ha_solarpayback_store.py "{{ data | tojson }}"'

# After adding both, restart HA (or reload via Developer Tools → YAML → Reload File Sensors and Reload Shell Commands).
# The sensor will be available as sensor.ha_solarpayback_data with the JSON content as its state.
# The service will be available at: POST /api/services/shell_command/ha_solarpayback_store
# with JSON body: {"gridEvents": [...], "tariffHistory": [...]}