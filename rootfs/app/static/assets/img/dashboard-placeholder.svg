<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" fill="none">
  <rect width="720" height="480" fill="#1C2B4A"/>
  <rect width="720" height="480" fill="url(#gridPattern)"/>
  <defs>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8FA3C4" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Panels grid (10x10) -->
