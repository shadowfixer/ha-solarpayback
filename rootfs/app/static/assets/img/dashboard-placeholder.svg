      <rect x="350" y="10" width="30" height="75" rx="2" opacity="0.9"/>
      <rect x="385" y="10" width="30" height="60" rx="2" opacity="0.9"/>
    </g>
    <g fill="#2F7A9E" opacity="0.7">
      <rect x="0" y="70" width="30" height="20" rx="2"/>
      <rect x="35" y="95" width="30" height="20" rx="2"/>
      <rect x="70" y="65" width="30" height="20" rx="2"/>
      <rect x="105" y="105" width="30" height="20" rx="2"/>
      <rect x="140" y="80" width="30" height="20" rx="2"/>
      <rect x="175" y="110" width="30" height="20" rx="2"/>
      <rect x="210" y="85" width="30" height="20" rx="2"/>
      <rect x="245" y="100" width="30" height="20" rx="2"/>
      <rect x="280" y="70" width="30" height="20" rx="2"/>
      <rect x="315" y="90" width="30" height="20" rx="2"/>
      <rect x="350" y="85" width="30" height="20" rx="2"/>
      <rect x="385" y="70" width="30" height="20" rx="2"/>
