      <rect x="320" y="26" width="36" height="20" rx="1"/>
      <rect x="360" y="26" width="36" height="20" rx="1"/>
      <rect x="2" y="50" width="36" height="20" rx="1"/>
      <rect x="40" y="50" width="36" height="20" rx="1"/>
      <rect x="80" y="50" width="36" height="20" rx="1"/>
      <rect x="120" y="50" width="36" height="20" rx="1"/>
      <rect x="160" y="50" width="36" height="20" rx="1"/>
