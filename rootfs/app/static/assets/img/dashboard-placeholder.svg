  <!-- Payback summary card -->
  <rect x="480" y="40" width="200" height="120" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#8FA3C4" stroke-width="2"/>
  <text x="490" y="70" font-family="system-ui, sans-serif" font-size="14" fill="#A2A9B5" font-weight="600">PAID BACK</text>
  <text x="490" y="100" font-family="system-ui, sans-serif" font-size="32" fill="#F2B705" font-weight="700">£2,850</text>
  <text x="490" y="125" font-family="system-ui, sans-serif" font-size="12" fill="#A2A9B5">30% of £9,150</text>

