  <text x="490" y="210" font-family="system-ui, sans-serif" font-size="14" fill="#A2A9B5" font-weight="600">PAYBACK DATE</text>
  <text x="490" y="245" font-family="system-ui, sans-serif" font-size="24" fill="#FFFFFF" font-weight="700">Mar 2028</text>
  <text x="490" y="268" font-family="system-ui, sans-serif" font-size="11" fill="#5BBF84">Est. 14 months left</text>

  <!-- Monthly bars -->
