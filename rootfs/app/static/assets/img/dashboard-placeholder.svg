      <rect x="280" y="2" width="36" height="20" rx="1"/>
      <rect x="320" y="2" width="36" height="20" rx="1"/>
      <rect x="360" y="2" width="36" height="20" rx="1"/>
      <rect x="2" y="26" width="36" height="20" rx="1"/>
